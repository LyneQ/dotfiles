# Font
[font]
normal = { family = "JetBrains Mono Nerd Font", style = "Regular" }
bold   = { family = "JetBrains Mono Nerd Font", style = "Bold" }
italic = { family = "JetBrains Mono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrains Mono Nerd Font", style = "Bold Italic" }
size = 10.0


# Window
[window]
padding = { x = 12, y = 12 }
# No exact "resize_debounce_time" in Alacritty
decorations = "None"  # hide_window_decorations yes
# Opacity: since 0.13, use opacity or background_opacity (deprecated)
opacity = 1.0       # background_opacity 0.50

# Scrolling
[scrolling]
history = 10000       # scrollback_lines
multiplier = 5        # wheel_scroll_multiplier

# Bell
[bell]
animation = "Linear"
duration = 150        # ms (visual_bell_duration 0.15)
color = "#00ffe7"     # closest to active border/cyan accent
# No audio bell -> disable terminal bell in your shell/app if needed

# Cursor
[cursor]
style = { shape = "Beam", blinking = "Off" } # Kitty default is beam; no blink
unfocused_hollow = false

[colors.cursor]
text = "#0d0d0d"      # cursor_text_color
cursor = "#fcee09"    # cursor

# Colors
[colors.primary]
background = "#0d0d0d"
foreground = "#e5e5e5"  # closest to Kitty's general fg usage

[colors.selection]
text = "#ff4179"         # selection_foreground
background = "#280015"   # selection_background

[colors.normal]
black   = "#000000"  # color0
red     = "#ff005f"  # color1
green   = "#00ff9f"  # color2
yellow  = "#fcee09"  # color3
blue    = "#00ffe7"  # color4
magenta = "#ff00d4"  # color5
cyan    = "#00d3ff"  # color6
white   = "#e5e5e5"  # color7

[colors.bright]
black   = "#7f7f7f"  # color8
red     = "#ff2040"  # color9
green   = "#00ffaa"  # color10
yellow  = "#fff75a"  # color11
blue    = "#46f9ff"  # color12
magenta = "#ff67f5"  # color13
cyan    = "#7de5ff"  # color14
white   = "#ffffff"  # color15
