[general]
import = [
#    "~/.config/alacritty/catpputcin-mocha.toml"
    "~/.config/alacritty/lynhe.toml"
]

# URL handling
# Alacritty doesn't have kitty's open_url_with/url_style/detect_urls.
# URL launching is handled by your OS; hints via external tools (e.g., alacritty + url-select scripts).

# Borders/active/inactive colors
# Alacritty doesn't support per-window border colors like Kitty.
# Titlebar/decorations are controlled via WM/DE.

# Remote control / sessions
# No direct allow_remote_control/startup_session equivalents.
