
font_family              JetBrains Mono Nerd Font
bold_font                auto
italic_font              auto
bold_italic_font         auto
font_size                12.0
adjust_line_height       0
adjust_column_width      0


foreground               #00ffe7
background               #0d0d0d
background_opacity       0.85

cursor                  #fcee09
cursor_text_color       #0d0d0d
selection_background    #280015
selection_foreground    #ff4179


window_padding_width     12
hide_window_decorations  yes
resize_debounce_time     30


scrollback_lines         10000
scrollback_pager         less
enable_mouse_reporting   yes
wheel_scroll_multiplier  5.0


open_url_with            default
url_style                single
detect_urls              yes


enable_audio_bell        no
visual_bell              yes
visual_bell_duration     0.15
active_border_color      #00ffe7
inactive_border_color    #ff005f


color0  #000000
color1  #ff005f
color2  #00ff9f
color3  #fcee09
color4  #00ffe7
color5  #ff00d4
color6  #00d3ff
color7  #e5e5e5
color8  #7f7f7f
color9  #ff2040
color10 #00ffaa
color11 #fff75a
color12 #46f9ff
color13 #ff67f5
color14 #7de5ff
color15 #ffffff

startup_session          default
