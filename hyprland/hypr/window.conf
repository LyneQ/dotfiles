# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Disable blur to specific apps
windowrule {
  name = windowrule-3
  no_blur = on
  match:class = ^(thunar)$
  match:title = ^()$
}


# Add Picture-in-Picture window to floating mode
windowrule {
  name = windowrule-4
  float = on
  match:title = .*Picture-in-Picture.*
}

windowrule {
  name = windowrule-5
  float = on
  match:title = .*PIP.*
}

windowrule {
  name = windowrule-6
  float = on
  match:title = .*Picture in picture.*
}


# Start some window as floating by default
windowrule {
  name = windowrule-7
  float = on
  match:class = ^(MuPDF)$
}

#windowrulev2 = float, class:^(Alacritty)$
windowrule {
  name = windowrule-8
  float = on
  match:class = ^(org.kde.ark)$
}

windowrule {
  name = windowrule-9
  float = on
  match:class = ^(org.kde.kcalc)$
}

windowrule {
  name = windowrule-10
  float = on
  match:class = ^(HyprSettings)$
}

windowrule {
  name = windowrule-11
  float = on
  match:class = ^(org.twosheds.iwgtk)$
}

windowrule {
  name = windowrule-12
  float = on
  match:class = ^(imv)$
}

render {
    direct_scanout = true
}

# Enable floating for the welcone Screen of IntelliJ IDEA and set in non floating for other window
windowrule {
  name = windowrule-13
  float = on
  size = 800 400
  match:class = ^(jetbrains-idea)$
  match:title = ^(Welcome to IntelliJ IDEA)$
}

