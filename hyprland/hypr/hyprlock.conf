background {
    monitor = DP-3
    path = ~/Images/wallpaper2077.png
    blur_size = 6
    blur_passes = 3
    brightness = 0.5
}

input-field {
    monitor = DP-3
    size = 6%, 4%
    outline_thickness = 2
    dots_rounding = 4
    dots_spacing = .6
    inner_color = rgba(0, 255, 231, 0.1)
    outer_color = rgba(0, 255, 231, 0.15)
    check_color = rgb(252, 238, 9)
    fail_color = rgb(255, 0, 95)
    font_color = rgb(252, 238, 9)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 2
    shadow_size = 2
    rounding = 12
    placeholder_text = <i>AUTH REQUIRED</i>
    fail_text = <b>ACCESS DENIED</b>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = cmd[update:1000] echo "$TIME"
    color = rgb(252, 238, 9)
    font_size = 150
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size = 4
    position = 0, 280
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = cmd[update:1000] echo "$(date +"%d/%m/%Y")"
    color = rgb(0, 255, 183)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 0
    shadow_size = 2
    position = 0, 120
    halign = center
    valign = center
}


