# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = hyprlock
exec-once = waybar
exec-once = wl-paste --watch cliphist store
exec-once = hyprctl setcursor Polarnight-cursors 24
exec-once = nwg-dock-hyprland -i 32 -x -d -lp start -hd 0 -hl top -iw "special,scratchpad"

# load all the plugins you installed (hyprpm)
exec-once = hyprctl plugin load "$HYPR_PLUGIN_DIR/lib/libhyprexpo.so"
exec-once = hyprpm reload
exec-once = hyprpaper
