# See https://wiki.hyprland.org/Configuring/Keywords/

# 1. Basic keybinds
$mainMod = SUPER # Sets "Windows" key as main modifier
bind = $mainMod, return, exec, $terminal #"Open terminal"
bind = $mainMod, Q, killactive, #"Close active window"
bind = $mainMod, M, exit, #"Exit Hyprland"
bind = $mainMod, F, fullscreenstate, 3 #"Toggle fullscreen"
bind = $mainMod, E, exec, $fileManager #"Open file manager"
bind = $mainMod, B, exec, $browser #"Open browser"
bind = $mainMod, V, togglefloating, #"Toggle floating"
bind = $mainMod, R, exec, $menu #"Open app menu"
bind = $mainMod, P, pseudo, #"dwindle"
bind = $mainMod, J, togglesplit, #"dwindlecc"
bind = $mainMod, N, exec, $notifyCenter, #"show notification center"

# 2. Utility keybinds
bind = $mainMod, F12, exec, grimblast --notify copysave area #"Screenshot area"
bind = $mainMod, C, exec, ~/.config/hypr/script/clipboard.sh #"Clipboard manager"
bind = $mainMod, F11, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle #"Toggle mic mute"
bind = $mainMod, PERIOD, exec, ~/.config/hypr/script/emoji-picker.sh #"Emoji picker"

# 3. Window management
bind = $mainMod, left, movefocus, l #"Move focus left"
bind = $mainMod, right, movefocus, r #"Move focus right"
bind = $mainMod, up, movefocus, u #"Move focus up"
bind = $mainMod, down, movefocus, d #"Move focus down"

# 4. Workspace management
bind = $mainMod, 1, workspace, 1 #"Switch to workspace 1"
bind = $mainMod, 2, workspace, 2 #"Switch to workspace 2"
bind = $mainMod, 3, workspace, 3 #"Switch to workspace 3"
bind = $mainMod, 4, workspace, 4 #"Switch to workspace 4"
bind = $mainMod, 5, workspace, 5 #"Switch to workspace 5"
bind = $mainMod, 6, workspace, 6 #"Switch to workspace 6"
bind = $mainMod, 7, workspace, 7 #"Switch to workspace 7"
bind = $mainMod, 8, workspace, 8 #"Switch to workspace 8"
bind = $mainMod, 9, workspace, 9 #"Switch to workspace 9"
bind = $mainMod, 0, workspace, 10 #"Switch to workspace 10"

# 5. Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Move active window to workspace 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Move active window to workspace 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Move active window to workspace 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Move active window to workspace 4"
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #"Move active window to workspace 5"
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #"Move active window to workspace 6"
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #"Move active window to workspace 7"
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #"Move active window to workspace 8"
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #"Move active window to workspace 9"
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #"Move active window to workspace 10"

# 4 . Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic #"Toggle special workspace"
bind = $mainMod SHIFT, S, movetoworkspace, special:magic #"Move active window to special workspace"

# 5. Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 #"Scroll to next workspace"
bind = $mainMod, mouse_up, workspace, e-1 #"Scroll to previous workspace"

# 6. Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow #"Move window with mouse"
bindm = $mainMod, mouse:273, resizewindow #"Resize window with mouse"
binde = $mainMod SHIFT, right, resizeactive, 30 0 #"Resize active window right"
binde = $mainMod SHIFT, left, resizeactive, -30 0 #"Resize active window left"
binde = $mainMod SHIFT, up, resizeactive, 0 -30 #"Resize active window up"
binde = $mainMod SHIFT, down, resizeactive, 0 30 #"Resize active window down"

# 7. Multimedia keys (Volume, Brightness, Media Controls)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ #"Raise volume"
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- #"Lower volume"
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle #"Mute audio"
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle #"Mute microphone"
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ #"Raise brightness"
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- #"Lower brightness"

# 8. Media playback controls
bindl = , XF86AudioNext, exec, playerctl next #"Next track"
bindl = , XF86AudioPause, exec, playerctl play-pause #"Pause media"
bindl = , XF86AudioPlay, exec, playerctl play-pause #"Play media"
bindl = , XF86AudioPrev, exec, playerctl previous #"Previous track"
