general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1

    col.active_border = rgb(e0e0e0)
    col.inactive_border = rgb(040404)

    resize_on_border = true
    hover_icon_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    # screen_shader = ~/.config/hypr/shader.frag

    shadow {
        enabled = true
        range = 4
        render_power = 4
        color = rgba(000000aa)
    }

    blur {
        enabled = false
        size = 1
        passes = 3
        vibrancy = 0.25
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 5.0, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, slide
    animation = windowsOut, 1, 1.5, linear, slide
    animation = fadeIn, 1, 1.7, almostLinear
    animation = fadeOut, 1, 1.4, almostLinear
    animation = fade, 1, 3.0, quick
    animation = layers, 1, 3.8, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.8, almostLinear
    animation = fadeLayersOut, 1, 1.4, almostLinear
    animation = workspaces, 1, 2.0, almostLinear, slide
    animation = workspacesIn, 1, 2, almostLinear, slide
    animation = workspacesOut, 1, 2, almostLinear, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_resizing = true
}

master {
    new_status = slave
    smart_resizing = true
    mfact = 0.60
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

env = HYPRCURSOR_THEME,Polarnight
env = HYPRCURSOR_SIZE,24

env = XCURSOR_THEME, Polarnight
env = XCURSOR_SIZE, 24

