
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

autogenerated = 0 # remove this line to remove the warning


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$terminal = alacritty 
$fileManager = nemo # nautilus
$menu = walker # wofi --show drun
$browser = ~/Apps/helium-0.7.10.1-x86_64_1834940b9149e147c6c480a6053ac825.AppImage # firefox

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_THEME, Polarnight-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia


#####################
### WAYBAR CONFIG ###
#####################

layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0.5
  match:namespace = waybar
}



#####################
### IMPORT CONFIG ###
#####################
source = ~/.config/hypr/auto-start.conf
source = ~/.config/hypr/style.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybind.conf
source = ~/.config/hypr/window.conf
source = ~/.config/hypr/monitor.conf
source = ~/.config/hypr/permission.conf
